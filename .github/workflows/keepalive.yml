# Supabase free projects pause after 7 idle days of low activity. Four small
# database reads each day keep this project active even when nobody visits.
#
# It used to read the project URL and key from repository secrets, and that was
# wrong twice over. It meant the workflow broke silently the moment the project
# changed — which is exactly what happened: the secrets went on naming a project
# that had been deleted, and the only sign was a failed-run email. And there was
# nothing to protect in the first place. Both values are *published*: they are
# compiled into index.html and served to every visitor, because the publishable
# key only says which project to talk to and the row-level-security policies
# decide what may be done once connected.
#
# So it reads them from the source it is already sitting next to. One place to
# change a project, and it is the place you would change anyway.
name: keep-supabase-awake
on:
  schedule:
    - cron: "17 */6 * * *"   # every six hours, away from the top-of-hour queue
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: ping the gallery's database
        run: |
          URL=$(grep -oP "CLOUD_URL = '\K[^']+" src/config.js || true)
          KEY=$(grep -oP "CLOUD_KEY = '\K[^']+" src/config.js || true)
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "no cloud project configured — nothing to keep awake"; exit 0
          fi
          echo "pinging ${URL}"
          # A project that is resuming can answer 521 briefly, and DNS or the
          # gateway can have a transient miss. Retry those instead of turning
          # one short warm-up into a failed keepalive run.
          if CODE=$(curl --silent --show-error --fail-with-body \
            --output /dev/null --write-out '%{http_code}' \
            --retry 5 --retry-all-errors --retry-delay 15 \
            --connect-timeout 15 --max-time 30 \
            "$URL/rest/v1/profiles?select=id&limit=1" -H "apikey: $KEY"); then
            CURL_EXIT=0
          else
            CURL_EXIT=$?
          fi
          echo "HTTP $CODE"
          # 200 is awake. 401/403 means the key is stale — worth failing on,
          # because a ping that cannot authenticate is not keeping anything
          # awake and should not sit there looking green.
          case "$CODE" in
            200) echo "the gallery is awake" ;;
            401|403) echo "::error::the key in src/config.js was rejected — is it the current project?"; exit 1 ;;
            521|540) echo "::error::Supabase is still paused or resuming; retry this workflow after the project is ready"; exit 1 ;;
            *) echo "::error::request failed after retries (curl $CURL_EXIT, HTTP ${CODE:-000}) from $URL"; exit 1 ;;
          esac
