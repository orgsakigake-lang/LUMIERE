# Supabase free projects pause after 7 idle days. This pings yours twice a
# week so the gallery never sleeps. It no-ops until you add two repository
# secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_URL      e.g. https://abcdefgh.supabase.co
#   SUPABASE_ANON_KEY the anon public key
name: keep-supabase-awake
on:
  schedule:
    - cron: "17 6 * * 1,4"   # Mondays and Thursdays, 06:17 UTC
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: ping the gallery's database
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "secrets not set yet — nothing to ping"; exit 0
          fi
          curl -sf "$URL/rest/v1/profiles?select=id&limit=1" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" > /dev/null \
            && echo "the gallery is awake"
